<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐线 · 3×3树冠</title><style>*{box-sizing:border-box}body{margin:0;background:#101b17;color:#d1dfd5;font:14px/1.7 system-ui}main{max-width:960px;padding:22px;margin:auto}a{color:#a6cdb2}button,select{padding:8px;background:#273f31;color:inherit;border:1px solid #627e67;margin:4px}canvas{width:288px;height:384px;image-rendering:pixelated;max-width:100%}.layout{display:flex;gap:24px;flex-wrap:wrap}section{min-width:0;flex:1}img{image-rendering:pixelated;width:96px;height:96px}figure{display:inline-block;margin:6px;text-align:center}code{color:#a6cdb2}h1{font-size:24px}.layout>canvas{flex:0 0 auto}.layout>section{flex:1 1 320px;overflow-wrap:anywhere}select{max-width:100%}</style><main><h1>庭院树木 · 3×3树冠</h1><p>原生96×96，视觉覆盖九格；仅第3行、第2列的树干格碰撞。玩家进入上两行时树冠不透明度降至30%，离开恢复100%。</p><p><a href="manifest.json">提示词与生成记录</a> · <a href="../../index.html">进入游戏</a> · <a href="../scene-furniture-directions/index.html">三向总览</a></p><div class="layout"><canvas id="preview" width="96" height="128"></canvas><section><label>玩家位置 <select id="zone"><option value="outside">树外</option><option value="upper1">树冠第1行</option><option value="upper2">树冠第2行</option><option value="lower">底行侧边（可通行）</option></select></label><br><label>树木朝向 <select id="direction"><option value="">正面</option><option value="_side">侧面</option><option value="_back">背面</option></select></label><p id="status"></p><p>红框：唯一实体碰撞格。浅绿框：树冠淡化触发范围。格坐标按“行、列”从1开始；数据内的 <code>collisionCells:[[1,2]]</code> 为从0开始的列、行偏移。</p><p>树冠在角色与其他物件之后绘制，并遵循已探索范围。该预览展示美术与淡化规则，游戏内仍以真实地形决定其余格能否通行。</p><div id="views"></div></section></div></main><script>
const ctx=document.querySelector('canvas').getContext('2d'),zone=document.querySelector('#zone'),dir=document.querySelector('#direction'),trees={},player=new Image();player.src='../chars/player_s.png';
function draw(){ctx.imageSmoothingEnabled=false;for(let y=0;y<4;y++)for(let x=0;x<3;x++){ctx.fillStyle=(x+y)%2?'#52604f':'#65705b';ctx.fillRect(x*32,y*32,32,32);}const pos={outside:[48,112],upper1:[48,16],upper2:[48,48],lower:[16,80]}[zone.value];if(player.complete)ctx.drawImage(player,pos[0]-16,pos[1]-16,32,32);const alpha=zone.value.startsWith('upper')?.3:1;ctx.globalAlpha=alpha;if(trees[dir.value]?.complete)ctx.drawImage(trees[dir.value],0,0,96,96);ctx.globalAlpha=1;ctx.strokeStyle='#85ba8b';ctx.strokeRect(.5,.5,95,63);ctx.strokeStyle='#e8796e';ctx.strokeRect(32.5,64.5,31,31);ctx.strokeStyle='#a2b8a144';for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*32,0);ctx.lineTo(i*32,96);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*32);ctx.lineTo(96,i*32);ctx.stroke();}document.querySelector('#status').textContent='树冠不透明度：'+Math.round(alpha*100)+'%';}
for(const suffix of ['', '_side','_back']){const image=new Image();image.src='../props/tree_courtyard_canopy'+suffix+'.png';image.onload=draw;trees[suffix]=image;document.querySelector('#views').insertAdjacentHTML('beforeend','<figure><img src="'+image.src+'" alt="树木'+suffix+'"><figcaption>'+({'':'正面',_side:'侧面',_back:'背面'})[suffix]+'</figcaption></figure>');}player.onload=draw;zone.onchange=dir.onchange=draw;draw();
</script></html>
