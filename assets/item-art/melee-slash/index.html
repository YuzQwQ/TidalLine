<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近战刀气 · 左右斩击</title><style>*{box-sizing:border-box}body{margin:0;background:#14231b;color:#d4dfd7;font:14px/1.8 system-ui}main{max-width:1050px;margin:auto;padding:24px}a{color:#aed5c3}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{padding:16px;background:#213729;min-width:0}img{width:100%;height:150px;object-fit:contain;image-rendering:pixelated}.demos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}canvas{width:100%;background:#192b21;image-rendering:pixelated}h2{font-size:20px}small{color:#90af9c}@media(max-width:600px){.grid,.demos{grid-template-columns:1fr}main{padding:14px}}</style><main><h1>近战刀气 · 两个方向</h1><p>128×64 透明像素贴图，挥砍时交替显示，命中后160毫秒内淡出。三种刀具共用两张图，长度保持原状，纵向厚度增至2.5倍，并裁切在判定扇形内。</p><p><a href="manifest.json">原稿与提示词</a> · <a href="../../../index.html#base">游戏</a> · <a href="../melee/index.html">持刀动画</a></p><div class="grid"><article><h2>左 → 右</h2><img src="../../../assets/effects/melee_slash_lr.png" alt="melee_slash_lr"><small>melee_slash_lr.png · <a href="sources/melee_slash_lr.png">原稿</a></small></article><article><h2>右 → 左</h2><img src="../../../assets/effects/melee_slash_rl.png" alt="melee_slash_rl"><small>melee_slash_rl.png · <a href="sources/melee_slash_rl.png">原稿</a></small></article></div><h2>三种武器范围预览（3倍）</h2><p>细线仅为预览中的判定边界；游戏常态只显示贴图。</p><div class="demos"><article><b>折叠刀 · 0.65格 / 55°</b><canvas width="240" height="200" data-i="0"></canvas></article><article><b>战斗刀 · 0.80格 / 75°</b><canvas width="240" height="200" data-i="1"></canvas></article><article><b>砍刀 · 0.95格 / 100°</b><canvas width="240" height="200" data-i="2"></canvas></article></div></main><script>const images=['lr','rl'].map(d=>{const img=new Image();img.src='../../../assets/effects/melee_slash_'+d+'.png';return img});let frame=0;function draw(){document.querySelectorAll('canvas').forEach(cv=>{const i=+cv.dataset.i,c=cv.getContext('2d'),r=[.65,.8,.95][i]*32*3,h=[55,75,100][i]*Math.PI/360;c.clearRect(0,0,240,200);c.save();c.translate(120,150);c.beginPath();c.moveTo(0,0);c.arc(0,0,r,-Math.PI/2-h,-Math.PI/2+h);c.closePath();c.strokeStyle='#426252';c.stroke();c.clip();c.imageSmoothingEnabled=false;const img=images[frame%2];if(img.complete&&img.naturalWidth)c.drawImage(img,4,4,120,56,-r*Math.sin(h),-r,2*r*Math.sin(h),r*(1-Math.cos(h)+.06)*2.5);c.restore();c.fillStyle='#7b9c8a';c.fillRect(117,147,6,6)});frame++}Promise.all(images.map(i=>i.decode())).then(()=>{draw();setInterval(draw,650)})</script></html>
